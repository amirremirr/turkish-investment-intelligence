name: Continue validated monthly holdings recovery

on:
  # The validation workflow is deliberately short. This continuation is only
  # started after it completes successfully and demonstrates either a target
  # report or substantial, error-free cursor progress through the MKK index.
  workflow_run:
    workflows: ["Monthly holdings recovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: "Recovery workflow run ID that owns the saved checkpoint"
        required: true
        # This is the retained checkpoint behind the interrupted July recovery.
        # New manual resumes should use the run ID printed by the prior
        # continuation run, not this historical default.
        default: "30437505783"
      checkpoint:
        description: "Checkpoint stage to resume"
        required: true
        type: choice
        default: "extended-pass-2"
        options: ["pass-2", "extended-pass-1", "extended-pass-2"]
      period:
        description: "Portfolio month to recover (YYYY-MM)"
        required: true
        default: "2026-06"

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  MKK_USERNAME: ${{ secrets.MKK_USERNAME }}
  MKK_PASSWORD: ${{ secrets.MKK_PASSWORD }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  REQUIRE_SUPABASE_PUBLISH: "true"
  PYTHONIOENCODING: utf-8
  RECOVERY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_run_id || github.event.workflow_run.id }}
  RECOVERY_CHECKPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint || 'pass-2' }}
  RECOVERY_PERIOD: ${{ github.event_name == 'workflow_dispatch' && inputs.period || '' }}
  RECOVERY_OUTPUT_ID: ${{ github.run_id }}

jobs:
  gate:
    name: Verify validation found reports
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.coverage.outputs.proceed }}
      period: ${{ steps.coverage.outputs.period }}
      reports: ${{ steps.coverage.outputs.reports }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore validated database
        uses: actions/cache/restore@v6
        with:
          path: data/funds.db
          key: funds-db-${{ env.RECOVERY_RUN_ID }}-${{ env.RECOVERY_CHECKPOINT }}
      - name: Restore durable KAP recovery checkpoint
        uses: actions/cache/restore@v6
        with:
          path: data/kap-recovery-state.db
          key: kap-recovery-${{ env.RECOVERY_RUN_ID }}-${{ env.RECOVERY_CHECKPOINT }}
          restore-keys: kap-recovery-
      - name: Merge KAP recovery checkpoint
        run: python scripts/kap_recovery_state.py import
      - name: Require restored database and serving credential
        run: |
          test -f data/funds.db || { echo "::error::validation database was not saved"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
      - name: Require healthy evidence before long recovery
        id: coverage
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from tefaslab import kap

          period = os.getenv("RECOVERY_PERIOD") or kap.latest_collection_period()
          conn = sqlite3.connect("data/funds.db")
          reports = conn.execute(
              "SELECT COUNT(DISTINCT fund_code) FROM mkk_disclosures "
              "WHERE reporting_period=? AND status IN ('found', 'parsed')",
              (period,),
          ).fetchone()[0]
          state = conn.execute(
              "SELECT head_index, cursor FROM mkk_monthly_scan_state WHERE period=?",
              (period,),
          ).fetchone()
          scanned = max(0, int(state[0]) - int(state[1])) if state else 0
          errors = conn.execute(
              "SELECT COUNT(*) FROM mkk_disclosures WHERE status='error'"
          ).fetchone()[0]
          conn.close()
          # June reports may be many thousands of disclosure indexes behind
          # the live head. A clean two-window validation that advances at least
          # 1,000 indexes is useful evidence even before it reaches that wave.
          healthy_progress = scanned >= 1000 and errors == 0
          # A manual run names an existing checkpoint and target period, so it
          # is an explicit operator decision to continue despite historical
          # upstream errors recorded in that ledger.
          manual_resume = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"
          proceed = "true" if manual_resume or reports or healthy_progress else "false"
          print(
              "MKK validation: "
              f"period={period}, discovered fund reports={reports}, "
              f"indexes scanned={scanned}, errors={errors}, proceed={proceed}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"proceed={proceed}\nperiod={period}\nreports={reports}\n"
                  f"scanned={scanned}\nerrors={errors}\n"
              )
          PY

  first-extended-pass:
    name: Extended recovery pass 1 of 2
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore validated database
        uses: actions/cache/restore@v6
        with:
          path: data/funds.db
          key: funds-db-${{ env.RECOVERY_RUN_ID }}-${{ env.RECOVERY_CHECKPOINT }}
      - name: Restore durable KAP recovery checkpoint
        uses: actions/cache/restore@v6
        with:
          path: data/kap-recovery-state.db
          key: kap-recovery-${{ env.RECOVERY_RUN_ID }}-${{ env.RECOVERY_CHECKPOINT }}
          restore-keys: kap-recovery-
      - name: Merge KAP recovery checkpoint
        run: python scripts/kap_recovery_state.py import
      - name: Continue four paced recovery cycles
        run: |
          test -f data/funds.db || { echo "::error::validation database was not saved"; exit 1; }
          PERIOD_ARG=""
          if [ -n "$RECOVERY_PERIOD" ]; then PERIOD_ARG="--period $RECOVERY_PERIOD"; fi
          python -m tefaslab holdings monthly --count 5000 --batches 50 --details 220 --parse-limit 150 --cycles 4 $PERIOD_ARG
          python -m tefaslab holdings stats
          python -m tefaslab daily --skip-raw
      - name: Save database for final pass
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/funds.db
          key: funds-db-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-1
      - name: Save KAP recovery checkpoint for final pass
        if: always()
        run: python scripts/kap_recovery_state.py export
      - name: Cache KAP recovery checkpoint for final pass
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/kap-recovery-state.db
          key: kap-recovery-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-1

  second-extended-pass:
    name: Extended recovery pass 2 of 2
    needs: first-extended-pass
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore database from extended pass 1
        uses: actions/cache/restore@v6
        with:
          path: data/funds.db
          key: funds-db-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-1
      - name: Restore KAP recovery checkpoint from extended pass 1
        uses: actions/cache/restore@v6
        with:
          path: data/kap-recovery-state.db
          key: kap-recovery-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-1
      - name: Merge KAP recovery checkpoint
        run: python scripts/kap_recovery_state.py import
      - name: Continue four paced recovery cycles
        run: |
          test -f data/funds.db || { echo "::error::extended recovery database was not saved"; exit 1; }
          PERIOD_ARG=""
          if [ -n "$RECOVERY_PERIOD" ]; then PERIOD_ARG="--period $RECOVERY_PERIOD"; fi
          python -m tefaslab holdings monthly --count 5000 --batches 50 --details 220 --parse-limit 150 --cycles 4 $PERIOD_ARG
          python -m tefaslab holdings stats
          python -m tefaslab daily --skip-raw
      - name: Save final database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/funds.db
          key: funds-db-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-2
      - name: Save final KAP recovery checkpoint
        if: always()
        run: python scripts/kap_recovery_state.py export
      - name: Cache final KAP recovery checkpoint
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/kap-recovery-state.db
          key: kap-recovery-${{ env.RECOVERY_OUTPUT_ID }}-extended-pass-2
