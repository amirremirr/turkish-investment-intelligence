name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest tests -q
      - name: Import smoke (every module loads)
        run: |
          python - <<'EOF'
          import importlib, pkgutil
          import tefaslab
          for m in pkgutil.iter_modules(tefaslab.__path__):
              if m.name == "__main__":
                  continue  # runs main() unconditionally; not importable standalone
              importlib.import_module(f"tefaslab.{m.name}")
              print("ok", m.name)
          EOF

  web:
    name: Web lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The current Next.js audit chain reports unresolved PostCSS/sharp
      # advisories with no safe upstream fix. Dependabot reviews all
      # severities weekly; CI blocks any newly introduced critical finding.
      - run: npm audit --omit=dev --audit-level=critical

  web-production-build:
    name: Web production build
    # A real build renders data-backed pages, so it is run against the
    # serving database only after code reaches main (never on forked PRs).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Require serving database credential
        run: test -n "$SUPABASE_DB_URL"
      - run: npm run build

  web-e2e:
    name: Web browser smoke tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require serving database credential
        run: test -n "$SUPABASE_DB_URL"
      - run: npm run test:e2e

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock
